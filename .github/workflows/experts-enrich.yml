name: Expert catalogue - OpenAlex enrichment
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 experts/scripts/enrich_openalex.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experts/data/openalex_works.json experts/data/openalex_institutions.json
          git commit -m "Expert catalogue: OpenAlex enrichment" || echo "nothing to commit"
          git pull --rebase
          git push
